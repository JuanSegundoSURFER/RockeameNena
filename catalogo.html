<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo | Rockeame Nena Accesorios</title>
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<style>
  .catalogo-hero{
    padding: 60px 0 20px;
    border-bottom: 1px solid var(--borde);
  }
  .catalogo-head{
    text-align: center;
    max-width: 640px;
    margin: 0 auto;
  }
  .catalogo-back{
    display:inline-block;
    color: var(--plata);
    text-decoration:none;
    font-size:.82rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .catalogo-back:hover{ color: var(--acento); }
  .catalogo-head .kicker{
    color: var(--acento); font-weight:700; letter-spacing:.2em;
    text-transform:uppercase; font-size:.75rem; margin-bottom:12px; display:block;
  }
  .catalogo-head h1{ font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom:12px; }
  .catalogo-head p{ color:#a09da5; font-size:1rem; line-height:1.6; }

  /* Catálogos del rubro acomodados uno al lado del otro */
  .catalogo-rubros{ padding: 40px 0 10px; }
  .catalogo-cat-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
  }
  .catalogo-cat-list .cat-card{
    width:190px;
    aspect-ratio: 3/4;
    flex-shrink:0;
  }
  .catalogo-cat-list .cat-card.activo{ border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }

  @media (max-width: 640px){
    .catalogo-cat-list{
      flex-wrap: nowrap;
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap:12px;
      padding-bottom: 10px;
      margin: 0 -16px;
      padding-left: 16px;
      padding-right: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .catalogo-cat-list::-webkit-scrollbar{ display:none; }
    .catalogo-cat-list .cat-card{
      width:140px;
      scroll-snap-align: start;
    }
  }

  /* Encabezado "Estás en: [catálogo]" */
  .catalogo-productos{ padding: 40px 0 70px; }
  .catalogo-actual{
    display:none;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
    text-align:center;
  }
  .catalogo-actual.visible{ display:flex; }
  .catalogo-actual span{ color:#a09da5; font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; }
  .catalogo-actual strong{ color: var(--acento); font-size:1.05rem; text-transform:uppercase; letter-spacing:.06em; }
  #catalogo-resultado{ color:#8a8790; font-size:.9rem; text-align:center; margin-top:24px; }
  .buscador-box, .cargar-mas-box{ display:none; }
  .buscador-box.visible, .cargar-mas-box.visible{ display:block; }
</style>
</head>
<body>

<header>
  <nav class="container nav">
    <div class="brand-group">
      <a href="index.html" class="brand">Rockeame Nena</a>
    </div>
    <div class="nav-actions">
      <button id="cart-toggle" class="cart-toggle" aria-label="Abrir carrito">
        🛒 <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </nav>
</header>

<section class="catalogo-hero">
  <div class="container">
    <div class="catalogo-head">
      <a class="catalogo-back" href="index.html#categorias">← Volver a categorías</a>
      <span class="kicker" id="catalogo-rubro">Catálogo</span>
      <h1 id="catalogo-titulo"></h1>
      <p id="catalogo-descripcion">Elegí un catálogo para ver sus productos.</p>
    </div>
  </div>
</section>

<!-- Catálogos del rubro, uno al lado del otro -->
<section class="catalogo-rubros">
  <div class="container">
    <div class="catalogo-cat-list" id="catalogo-cat-list">
      <!-- Se completan sola con los catálogos del rubro -->
    </div>
  </div>
</section>

<!-- Productos del catálogo elegido -->
<section class="catalogo-productos" id="catalogo-productos">
  <div class="container">
    <div class="catalogo-actual" id="catalogo-actual">
      <span>Estás en:</span>
      <strong id="catalogo-actual-nombre"></strong>
    </div>

    <div class="buscador-box" id="catalogo-buscador-box">
      <input type="text" id="catalogo-buscador" placeholder="Buscar en este catálogo..." aria-label="Buscar en este catálogo">
    </div>

    <div class="prod-grid" id="prod-grid"></div>
    <p id="catalogo-resultado"></p>
    <div class="cargar-mas-box" id="catalogo-cargar-box">
      <button id="cargar-mas-btn" class="btn-secondary" type="button">Ver más productos</button>
    </div>
  </div>
</section>

<!-- ===================== IMAGEN AMPLIADA (lightbox) ===================== -->
<div id="lightbox-overlay" class="cart-overlay"></div>

<div id="lightbox-modal" class="lightbox-modal">
  <button id="lightbox-close" class="lightbox-close" aria-label="Cerrar">✕</button>
  <div id="lightbox-content" class="lightbox-content"></div>
  <p id="lightbox-nombre" class="lightbox-nombre"></p>
</div>

<!-- ===================== CARRITO (drawer lateral) ===================== -->
<div id="cart-overlay" class="cart-overlay"></div>

<aside id="cart-drawer" class="cart-drawer">
  <div class="cart-drawer-head">
    <h3>Tu carrito</h3>
    <button id="cart-close" class="cart-close" aria-label="Cerrar carrito">✕</button>
  </div>

  <div id="cart-items" class="cart-items">
    <p class="cart-empty">Todavía no agregaste productos.</p>
  </div>

  <div class="cart-drawer-foot">
    <div class="cart-total-row">
      <span>Total</span>
      <span id="cart-total">$0</span>
    </div>
    <button id="cart-checkout-btn" class="form-submit" disabled>Finalizar pedido</button>
  </div>
</aside>

<!-- ===================== CHECKOUT ===================== -->
<div id="checkout-overlay" class="cart-overlay"></div>

<div id="checkout-modal" class="checkout-modal">
  <div class="checkout-head">
    <h3>Finalizar pedido</h3>
    <button id="checkout-close" class="cart-close" aria-label="Cerrar">✕</button>
  </div>

  <form id="checkout-form">
    <div class="form-group">
      <label for="co-nombre">Nombre y apellido</label>
      <input id="co-nombre" type="text" placeholder="Tu nombre" required>
    </div>
    <div class="form-group">
      <label for="co-telefono">Teléfono</label>
      <input id="co-telefono" type="tel" placeholder="Ej: 11 3228-3924" required>
    </div>
    <div class="form-group">
      <label for="co-pago">Método de pago</label>
      <select id="co-pago" required>
        <option value="" disabled selected>Elegí una opción</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia bancaria</option>
        <option value="Tarjeta de débito/crédito">Tarjeta de débito/crédito</option>
        <option value="Mercado Pago">Mercado Pago</option>
      </select>
    </div>
    <div class="form-group">
      <label for="co-entrega">Entrega</label>
      <select id="co-entrega" required>
        <option value="" disabled selected>Elegí una opción</option>
        <option value="Retiro en local">Retiro en local</option>
        <option value="Envío a domicilio">Envío a domicilio</option>
      </select>
    </div>
    <div class="form-group">
      <label for="co-direccion">Dirección (si es envío)</label>
      <input id="co-direccion" type="text" placeholder="Calle, número, ciudad">
    </div>
    <div class="form-group">
      <label for="co-notas">Notas adicionales</label>
      <textarea id="co-notas" rows="2" placeholder="Aclaraciones sobre tu pedido"></textarea>
    </div>

    <button type="submit" class="form-submit">Comprar por WhatsApp</button>
  </form>
</div>

<script src="Productos.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
